<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">One video, different audiences</title>
  <desc id="hero-desc">A central video player branching out into three different topic panels — recipes, sports, and parenting — illustrating how the same end-screen strip adapts to the article around it.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6ed"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="player" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#003b57"/>
      <stop offset="1" stop-color="#002837"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6900"/>
      <stop offset="1" stop-color="#d94d00"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#003b57" opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>

  <!-- ─── Central video player ─────────────────────────────────────────── -->
  <g transform="translate(80,80)">
    <rect x="0" y="0" width="380" height="260" rx="14" fill="url(#player)"/>
    <!-- TV-channel-style frame line -->
    <rect x="0" y="0" width="380" height="260" rx="14" fill="none" stroke="#ff6900" stroke-width="3"/>
    <!-- Play triangle -->
    <polygon points="160,90 160,210 260,150" fill="#ffffff" opacity="0.95"/>
    <!-- Progress bar -->
    <rect x="20" y="232" width="340" height="6" rx="3" fill="#ffffff" opacity="0.2"/>
    <rect x="20" y="232" width="170" height="6" rx="3" fill="#ff6900"/>
    <circle cx="190" cy="235" r="6" fill="#ffffff"/>
    <!-- Mini caption -->
    <text x="190" y="295" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#003b57" text-anchor="middle">main clip · 0:42 / 1:30</text>
  </g>

  <!-- ─── Connector arcs ────────────────────────────────────────────────── -->
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="4 6">
    <path d="M 460 130 C 600 130, 660 80,  790 80"  stroke="#ff6900"/>
    <path d="M 460 210 C 600 210, 660 210, 790 210" stroke="#00acd7"/>
    <path d="M 460 290 C 600 290, 660 340, 790 340" stroke="#003b57" opacity="0.55"/>
  </g>
  <g fill="#ff6900"><circle cx="790" cy="80"  r="5"/></g>
  <g fill="#00acd7"><circle cx="790" cy="210" r="5"/></g>
  <g fill="#003b57" opacity="0.6"><circle cx="790" cy="340" r="5"/></g>

  <!-- ─── Three destination panels ──────────────────────────────────────── -->
  <!-- Panel 1: Recipes -->
  <g transform="translate(810,40)">
    <rect x="0" y="0" width="310" height="100" rx="10" fill="#ffffff" stroke="#ffd7b3" stroke-width="1.5"/>
    <!-- icon: chef hat -->
    <g transform="translate(18,30)" fill="#ff6900">
      <circle cx="14" cy="14" r="10"/>
      <circle cx="26" cy="11" r="11"/>
      <circle cx="40" cy="14" r="10"/>
      <rect x="10" y="22" width="34" height="14" rx="3"/>
    </g>
    <text x="80" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#ff6900">RECIPE ARTICLE</text>
    <text x="80" y="52" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#002837">→ more recipes</text>
    <!-- thumbnails -->
    <g fill="#fff6ed" stroke="#ffd7b3" stroke-width="1">
      <rect x="80"  y="62" width="60" height="32" rx="3"/>
      <rect x="148" y="62" width="60" height="32" rx="3"/>
      <rect x="216" y="62" width="60" height="32" rx="3"/>
    </g>
    <g fill="#ff6900" opacity="0.7">
      <polygon points="103,72 103,84 115,78"/>
      <polygon points="171,72 171,84 183,78"/>
      <polygon points="239,72 239,84 251,78"/>
    </g>
  </g>

  <!-- Panel 2: Sports -->
  <g transform="translate(810,170)">
    <rect x="0" y="0" width="310" height="100" rx="10" fill="#ffffff" stroke="#bfe9f4" stroke-width="1.5"/>
    <!-- icon: stylized ball -->
    <g transform="translate(28,38)" fill="#00acd7">
      <circle cx="0" cy="0" r="20"/>
      <path d="M -20 0 L 20 0 M 0 -20 L 0 20 M -14 -14 L 14 14 M -14 14 L 14 -14" stroke="#ffffff" stroke-width="2" fill="none"/>
    </g>
    <text x="80" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#00acd7">SPORTS ARTICLE</text>
    <text x="80" y="52" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#002837">→ more sports</text>
    <g fill="#e6f6fb" stroke="#bfe9f4" stroke-width="1">
      <rect x="80"  y="62" width="60" height="32" rx="3"/>
      <rect x="148" y="62" width="60" height="32" rx="3"/>
      <rect x="216" y="62" width="60" height="32" rx="3"/>
    </g>
    <g fill="#00acd7" opacity="0.7">
      <polygon points="103,72 103,84 115,78"/>
      <polygon points="171,72 171,84 183,78"/>
      <polygon points="239,72 239,84 251,78"/>
    </g>
  </g>

  <!-- Panel 3: Parenting -->
  <g transform="translate(810,300)">
    <rect x="0" y="0" width="310" height="100" rx="10" fill="#ffffff" stroke="#cdd5dc" stroke-width="1.5"/>
    <!-- icon: a heart / parent-child silhouette -->
    <g transform="translate(28,38)" fill="#003b57">
      <path d="M 0 6 C 0 -6, -14 -6, -14 4 C -14 14, 0 22, 0 22 C 0 22, 14 14, 14 4 C 14 -6, 0 -6, 0 6 Z"/>
    </g>
    <text x="80" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#003b57">PARENTING ARTICLE</text>
    <text x="80" y="52" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#002837">→ more parenting</text>
    <g fill="#f1f4f7" stroke="#cdd5dc" stroke-width="1">
      <rect x="80"  y="62" width="60" height="32" rx="3"/>
      <rect x="148" y="62" width="60" height="32" rx="3"/>
      <rect x="216" y="62" width="60" height="32" rx="3"/>
    </g>
    <g fill="#003b57" opacity="0.55">
      <polygon points="103,72 103,84 115,78"/>
      <polygon points="171,72 171,84 183,78"/>
      <polygon points="239,72 239,84 251,78"/>
    </g>
  </g>

  <!-- ─── Subtle labels ─────────────────────────────────────────────────── -->
  <g font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#003b57" opacity="0.75">
    <text x="80"  y="55">SAME EMBED, SAME VIDEO POOL</text>
    <text x="810" y="22">DIFFERENT END-SCREEN</text>
  </g>
</svg>
